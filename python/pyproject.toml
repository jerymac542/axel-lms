[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "apexos-ai"
version = "0.1.0"
description = "Apexos AI Services for Axel LMS"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Apexos Team", email = "team@apexos.io"}]
maintainers = [{name = "Apexos Team", email = "team@apexos.io"}]
keywords = ["lms", "education", "ai", "ml", "analytics", "apexos", "axel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydantic-extra-types>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",

    # Async/HTTP
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "anyio>=4.4",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "aioredis>=2.0",

    # Message Queue
    "aio-pika>=9.4",
    "nats-py>=2.7",
    "faust-streaming>=0.10",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "authlib>=1.3",
    "pyotp>=2.9",

    # Observability
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.45",
    "opentelemetry-instrumentation-sqlalchemy>=0.45",
    "opentelemetry-instrumentation-redis>=0.45",
    "opentelemetry-instrumentation-httpx>=0.45",
    "opentelemetry-exporter-otlp>=1.26",
    "prometheus-client>=0.20",
    "structlog>=24.1",

    # ML/AI
    "torch>=2.4",
    "torchvision>=0.19",
    "torchaudio>=2.4",
    "transformers>=4.42",
    "sentence-transformers>=3.0",
    "accelerate>=0.32",
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "langchain>=0.2",
    "langgraph>=0.1",
    "langsmith>=0.1",
    "llama-index>=0.10",
    "openai>=1.35",
    "anthropic>=0.28",
    "google-generativeai>=0.7",
    "cohere>=5.0",
    "vllm>=0.5",
    "trl>=0.9",
    "datasets>=2.19",
    "evaluate>=0.4",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "optuna>=3.6",
    "mlflow>=2.14",
    "wandb>=0.17",

    # Data
    "pandas>=2.2",
    "polars>=1.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyarrow>=16.1",
    "duckdb>=1.0",
    "clickhouse-connect>=0.8",

    # NLP
    "spacy>=3.7",
    "nltk>=3.8",
    "textstat>=0.7",
    "language-tool-python>=2.7",

    # Utilities
    "python-ulid>=2.3",
    "python-slugify>=8.0",
    "python-magic>=0.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "phonenumbers>=8.13",
    "babel>=2.14",
    "pendulum>=3.0",
    "croniter>=2.4",
    "apscheduler>=3.10",
    "celery>=5.4",
    "flower>=2.0",

    # Testing
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.98",
    "faker>=25.0",
    "factory-boy>=3.3",
    "testcontainers>=4.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright>=1.1",
    "pre-commit>=3.7",
    "ipython>=8.25",
    "ipdb>=0.13",
    "jupyter>=1.0",
    "notebook>=7.1",
    "jupyterlab>=4.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
gpu = [
    "torch[cuda]>=2.4",
    "bitsandbytes[cuda]>=0.43",
    "flash-attn>=2.6",
    "xformers>=0.0.27",
]

[tool.pdm]
python = "3.12"

[tool.pdm.scripts]
dev = "uvicorn ai_service.main:app --reload --host 0.0.0.0 --port 8000"
test = "pytest -xvs"
lint = "ruff check . && mypy ."
format = "ruff format ."
migrate = "alembic upgrade head"
makemigrations = "alembic revision --autogenerate -m"
seed = "python -m scripts.seed"
worker = "celery -A shared.celery worker -l info"
beat = "celery -A shared.celery beat -l info"
flower = "celery -A shared.celery flower --port=5555"

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T20", "PYI", "PT", "Q", "RUF", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RET", "FLY", "INP", "ISC", "ICN", "PIE", "TCH", "INT", "LOG", "PERF", "ASYNC",
]
ignore = []
fixable = ["ALL"]
unfixable = []
pydantic-version = "2.9"
django-version = "5.0"
external-builtins = ["_"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
enable_error_code = ["arg-type", "attr-defined", "call-arg", "comparison-overlap", "dict-iter-missing-items", "index", "misc", "name-defined", "no-any-return", "no-untyped-call", "no-untyped-def", "override", "return-value", "truthy-bool", "union-attr", "unused-ignore", "valid-type", "var-annotated"]
exclude = ["**/migrations/**", "**/alembic/**", ".venv/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "gpu: Requires GPU",
]

[tool.coverage.run]
source = ["ai_service", "analytics_service", "grading_service", "recommendation_service", "nlp_service", "shared"]
omit = ["**/tests/**", "**/migrations/**", "**/alembic/**"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*_service*", "shared*"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]